input {
  beats {
    port => 5000
  }
}

filter {
  # Kubernetes logs have structure: <timestamp> stdout F <message>
  grok {
    match => { "message" => ["%{TIMESTAMP_ISO8601:log_timestamp} %{DATA:stream} %{WORD:log_level}? %{GREEDYDATA:log_message}"] }
    overwrite => [ "message" ]
  }

  # If grok fails, fall back to raw message
  if "_grokparsefailure" in [tags] {
    mutate {
      rename => { "message" => "log_message" }
    }
  }

  # Add Kubernetes metadata if present
  if [kubernetes] {
    mutate {
      add_field => {
        "k8s_pod" => "%{[kubernetes][pod][name]}"
        "k8s_container" => "%{[kubernetes][container][name]}"
        "k8s_namespace" => "%{[kubernetes][namespace]}"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "kubernetes-logs-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/ollama   # stored on minikube node
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          
          command:
            - sh
            - -c
            - |
              echo "Starting Ollama server..."
              ollama serve &

              # Wait for server to become ready
              sleep 10

              echo "Pulling model llama3.2 if not present..."
              ollama list | grep -q 'llama3.2' || ollama pull llama3.2

              wait

          ports:
            - containerPort: 11434

          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"

          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "6Gi"

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      protocol: TCP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command:
            - sh
            - -c
            - |
              # Start Ollama server in background
              ollama serve &

              # Wait a few seconds for server to start
              sleep 10

              # Pull model in background so container doesn't block startup
              ollama pull llama3.2 &

              # Bring server to foreground so pod stays alive
              wait

          ports:
            - containerPort: 11434

          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"

          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "6Gi"

      volumes:
        - name: ollama-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
